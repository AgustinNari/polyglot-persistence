version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: tpo_sqlserver
    environment:
      SA_PASSWORD: "constraseñaSQL4321234"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql


  mongodb:
    image: mongo:6
    container_name: tpo_mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongodb_data:/data/db



  mongo-init:
    image: mongo:6
    depends_on:
      - mongodb
    entrypoint:
      - bash
      - -c
      - |
        echo "Esperando Mongo para iniciar réplica..."
        sleep 5
        mongosh --host mongodb:27017 --eval "rs.initiate()"


  redis:
    image: redis:7
    container_name: tpo_redis
    ports:
      - "6379:6379"


  cassandra:
    image: cassandra:4
    container_name: tpo_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra



  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
    volumes:
      - ./init:/init
    entrypoint: >
      bash -c "
      echo 'Esperando a SQL Server...' &&
      sleep 15 &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'constraseñaSQL4321234' -d master -i /init/init.sql
      "

  cassandra-init:
    image: cassandra:4
    depends_on:
      - cassandra
    volumes:
      - ./init:/init
    entrypoint: >
      bash -c "
      echo 'Esperando a Cassandra...' &&
      sleep 20 &&
      cqlsh cassandra -f /init/init.cql
      "

volumes:
  sqlserver_data:
  mongodb_data:
  cassandra_data:
