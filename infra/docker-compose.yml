version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: tpo_sqlserver
    environment:
      SA_PASSWORD: "constraseñaSQL4321234"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    # NO confíes en init automáticos de SQL Server; inicializaremos más abajo manualmente.

  mongodb:
    image: mongo:6
    container_name: tpo_mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    # No montamos init aquí porque iniciaremos réplica y colecciones manualmente.

  # Servicio que espera y ejecuta rs.initiate() para Mongo
  mongo-init:
    image: mongo:6
    depends_on:
      - mongodb
    entrypoint:
      - bash
      - -c
      - |
        echo "Esperando Mongo para iniciar réplica..."
        sleep 5
        mongosh --host mongodb:27017 --eval "rs.initiate()"
    # No expone puertos; solo arranca tras mongodb.

  redis:
    image: redis:7
    container_name: tpo_redis
    ports:
      - "6379:6379"
    # No scripts de init necesarios para Redis.

  cassandra:
    image: cassandra:4
    container_name: tpo_cassandra
    ports:
      - "9042:9042"
    # Inicializaremos Cassandra manualmente con cqlsh.
