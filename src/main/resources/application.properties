# SQL Server
sql.url=jdbc:sqlserver://localhost:1433;databaseName=TPO;encrypt=false;trustServerCertificate=true
sql.user=sa
# SQL password is required in the MSSQL_SA_PASSWORD environment variable.

# MongoDB
mongo.uri=mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
mongo.db=tpo

# Redis
redis.host=localhost
redis.port=6379

# Cassandra
cassandra.contactPoint=127.0.0.1
cassandra.port=9042
cassandra.datacenter=datacenter1
cassandra.keyspace=tpo
