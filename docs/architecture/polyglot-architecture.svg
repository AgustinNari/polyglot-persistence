<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Polyglot Persistence Architecture</title>
<desc id="desc">Console UI and Java service layers connect through data access objects to SQL Server for users and orders, MongoDB for product catalog, Redis for shopping carts and undo/redo, and Cassandra for login and logout session history.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 6 3 L 0 6 z" fill="#9cb4d4"/></marker>
</defs>
<rect width="1200" height="650" rx="26" fill="#0b1220"/>
<text x="600" y="52" fill="#f2f7ff" font-size="31" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Polyglot Persistence</text>
<text x="600" y="83" fill="#a8bbd4" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Console-based commerce application · Java 17 · four purpose-specific data stores</text>
<rect x="340" y="108" width="520" height="76" rx="16" fill="#15243a" stroke="#527eaf" stroke-width="2"/>
<text x="600" y="139" fill="#ffffff" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Console Interface</text>
<text x="600" y="163" fill="#bdd0e8" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Authentication · Catalog · Cart · Orders · Billing</text>
