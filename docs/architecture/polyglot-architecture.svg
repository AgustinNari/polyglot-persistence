<text x="600" y="289" fill="#c6d7eb" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Domain Models · Business Services</text>
<text x="600" y="312" fill="#c6d7eb" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Data Access Objects (DAOs)</text>
<line x1="600" y1="326" x2="600" y2="365" stroke="#9cb4d4" stroke-width="3"/>
<line x1="150" y1="365" x2="1050" y2="365" stroke="#9cb4d4" stroke-width="3"/>
